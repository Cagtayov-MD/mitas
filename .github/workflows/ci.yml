name: CI — lint + smoke + pure-logic tests

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  ci:
    name: Python 3.10 / ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------ #
      # Python kurulumu                                                      #
      # ------------------------------------------------------------------ #
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ffprobe (2026-07-31): test_asr_vad + test_asr_entity_normalization gerçekten
      # ffprobe'a shell-out ediyor (normalize kapısı: "model YÜKLENMEDEN önce
      # normalize-değil wav'ı reddet"). Runner imajında ffmpeg yok → iki test
      # AudioNormalizeError ile düşüyordu. Testleri listeden atmak yerine aracı
      # kuruyoruz: kapı gerçek bir regresyonu koruyor. ~15 sn, GPU/model yok.
      - name: Sistem aracı — ffmpeg/ffprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffprobe -version | head -1

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          # Yalnız lint + pure-logic test bağımlılıkları; ağır GPU/model paketleri YOK.
          # pyyaml/fastapi/httpx (2026-07-31 eklendi): aşağıdaki test listesinde
          # bunları import eden 7 dosya vardı ama kurulmuyorlardı → pytest
          # TOPLAMA aşamasında düşüyor ve listenin TAMAMI koşmuyordu (exit 4).
          # Üçü de saf-python, GPU/model yok — "hafif CI" ilkesi korunuyor.
          # httpx yalnız fastapi.testclient (test_tedial_router_enqueue) için.
          pip install ruff pytest pydantic pyyaml fastapi httpx

      # ------------------------------------------------------------------ #
      # 1. Ruff lint — UYARI modunda (fail etmez, sadece raporlar)          #
      # ------------------------------------------------------------------ #
      - name: Ruff lint (warn-only)
        run: |
          ruff check . --output-format=github || true

      # ------------------------------------------------------------------ #
      # 2. py_compile import-smoke — production modüller sözdizimi doğru mu?#
      #    Heavy importları ÇAĞIRMA; sadece parse/compile.                  #
      # ------------------------------------------------------------------ #
      - name: py_compile smoke — mitas_pipeline.py
        run: python -m py_compile scripts/mitas_pipeline.py

      - name: py_compile smoke — _pipe_*.py
        run: |
          python -m py_compile scripts/_pipe_asr.py
          python -m py_compile scripts/_pipe_ocr.py
          python -m py_compile scripts/_pipe_hibrit_okuma.py
          python -m py_compile scripts/_pipe_pdf.py
          python -m py_compile scripts/_pipe_credit_video.py

      - name: py_compile smoke — pipeline runtime bağımlıları
        run: |
          python -m py_compile scripts/_channel_lang.py
          python -m py_compile scripts/_subtitle_detect.py
          python -m py_compile scripts/_kunye_classify.py
          python -m py_compile scripts/_kunye_qwen_check.py

      - name: py_compile smoke — credit/künye çekirdeği (en sık düzenlenen)
        run: |
          python -m py_compile scripts/credit_qc_block.py
          python -m py_compile scripts/credit_text_read.py
          python -m py_compile scripts/credit_crosscheck.py
          python -m py_compile scripts/tek_film_kunye.py
          python -m py_compile scripts/_pipe_credit_text.py
          python -m py_compile scripts/_pipe_credit_vl.py

      - name: py_compile smoke — OCR-worktree/pdf-mitas
        run: |
          for f in OCR-worktree/pdf-mitas/*.py; do
            echo "compile: $f"
            python -m py_compile "$f"
          done

      # core/api/asr_server.py ağır yan-etki importları var (FastAPI app);
      # yalnız syntax kontrolü yap, runtime import değil.
      - name: py_compile smoke — core/api/asr_server.py
        run: python -m py_compile core/api/asr_server.py

      # ------------------------------------------------------------------ #
      # 3. Pytest — yalnız GPU/model/ağ/Windows-path gerektirmeyen testler  #
      # ------------------------------------------------------------------ #
      - name: Pytest — pure-logic / schema / unit tests
        env:
          # FastAPI/access testlerinin secret beklemesini önle
          MITAS_ACCESS_SECRET: "ci-test-secret"
          # Transformers TF/Flax import çökmesini önle
          USE_TF: "0"
          USE_FLAX: "0"
        run: |
          python -m pytest \
            tests/test_schema_media.py \
            tests/test_schema_job_run.py \
            tests/test_schema_evidence.py \
            tests/test_schema_timeline.py \
            tests/test_schema_candidate_relation.py \
            tests/test_chunking.py \
            tests/test_asr_channel_merge.py \
            tests/test_asr_ab_chunks.py \
            tests/test_asr_entity_normalization.py \
            tests/test_asr_quality.py \
            tests/test_asr_stereo_redundancy.py \
            tests/test_asr_vad.py \
            tests/test_benchmark_yaml_parse.py \
            tests/test_translate_payload_language.py \
            tests/test_tedial_parser.py \
            tests/test_tedial_login_proxy_helpers.py \
            tests/test_dummy_worker.py \
            tests/test_job_partial.py \
            tests/test_job_repository.py \
            tests/test_job_retry.py \
            tests/test_ocr_fallback_strategy.py \
            tests/test_ocr_text_event_schema.py \
            tests/test_ocr_confidence_thresholds.py \
            tests/test_ocr_simple_pipeline.py \
            tests/test_ocr_box_track_pipeline.py \
            tests/test_hibrit_okuma_veto.py \
            tests/test_ozet_ozel_ad_kasa.py \
            tests/test_yonetmen_kurtar.py \
            tests/test_altbaslik_harf_kapisi.py \
            tests/test_yonetmen_rol_denetimi.py \
            tests/test_cast_kasa_kapisi.py \
            tests/test_tedial_import_queue.py \
            tests/test_tedial_session_broker.py \
            tests/test_tedial_router_lazy.py \
            tests/test_tedial_router_enqueue.py \
            tests/test_tedial_job_runner.py \
            tests/test_tedial_media_resolver.py \
            -v --tb=short
      # NOT: credit/künye pytest-kapısı (test_qc_c*/nonlatin/kunye_suclu) EKLENMEDİ — CI ortamı
      # yalnız ruff/pytest/pydantic kuruyor; bu testler reportlab/unidecode/duckdb + bazıları sabit
      # Windows-yolu gerektirdiğinden ubuntu-latest'te KIRILIYOR (tarafsız CI-env testiyle doğrulandı:
      # 6 failed/61 passed). Eklemek için: install'a reportlab+unidecode+duckdb + sabit-yol portatif +
      # DB/dep-gerektiren testlere skipif. py_compile smoke (yukarıda) credit dosyalarını zaten korur.
