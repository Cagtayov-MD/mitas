benchmark_id: asr_gold_probe_v0_1
benchmark_name: ASR gold probe benchmark
module: asr
purpose: Build a small diverse manually scored set before deciding fast/quality/hybrid policy.
decision_policy:
  default_candidate: fast-first selective quality
  final_if:
    - fast-only, quality-only, and hybrid candidates are compared against manual references.
    - named entity errors are reviewed separately from WER/CER.
metrics:
  - wer
  - cer
  - runtime_per_audio_minute
  - safety_passed
  - quality_drop_count
reference_rules:
  transcript_level: exact text for selected time windows
  punctuation: punctuation differences should not decide the model
  casing: casing differences should not decide the model
  named_entities: review manually and mark important person/place/institution names
review_workflow:
  mode: asr_candidate_correction
  candidate_command: python scripts/asr_model_final_benchmark.py --manifest benchmark_templates/asr_gold_probe_benchmark.yaml --out-root outputs/asr_gold_probe_benchmark --review
  user_task: Listen to the ASR candidate text and report only wrong words or phrases.
  score_gate: Reference files must not contain timestamps, TODO placeholders, or draft comment lines.
samples:
  - sample_id: gold_h1_news_0000_0100
    category: clean_news
    source_path: outputs/asr_archive_all_wav_benchmark/001_h1/audio_16000hz_mono_s16.wav
    start_sec: 0.0
    end_sec: 100.0
    reference_path: references/asr_gold_probe/gold_h1_news_0000_0100.txt
    review_priority: medium
    notes: Clean short news/professional speech sample.
  - sample_id: gold_neretva_bridge_0340_0440
