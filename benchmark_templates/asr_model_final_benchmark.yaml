    review_priority: high
    notes: Clean report with several names and institutions.
  - sample_id: trt_haber_3_full
    category: clean_news
    source_path: testklipler/trt_haber (3).mp4
    start_sec: null
    end_sec: null
    reference_path: references/asr_model_final/trt_haber_3_full.txt
