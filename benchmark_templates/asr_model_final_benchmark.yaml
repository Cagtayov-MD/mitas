benchmark_id: asr_model_final_v0_1
benchmark_name: ASR model finalization mini benchmark
module: asr
purpose: Decide whether large-v3-turbo can be the default ASR model with large-v3 as the quality fallback.
decision_policy:
  default_candidate: large-v3-turbo
  fallback_candidate: large-v3
  preferred_runtime_profile: fast_with_fallback
  final_if:
    - large-v3-turbo has no safety failures on the mini set.
    - large-v3-turbo WER is no more than 0.03 absolute worse than large-v3 on clean news samples.
    - large-v3-turbo does not drop important named entities compared with large-v3 in manual review.
    - large-v3-turbo is at least 1.5x faster than large-v3 on average.
  not_final_if:
    - Any model creates repeated-token collapse, long-token artifact, or stock subtitle artifact that passes the quality gate.
    - large-v3-turbo misses whole spoken passages that large-v3 captures.
    - Timestamp drift makes downstream timeline use unreliable.
metrics:
  - wer
  - cer
  - runtime_per_audio_minute
  - speedup_vs_large_v3
  - clean_word_count
  - safety_passed
  - quality_drop_count
  - manual_named_entity_notes
reference_rules:
  transcript_level: sentence-level text is enough for v0.1 model choice
  punctuation: punctuation differences should not decide the model
  casing: casing differences should not decide the model
  named_entities: review manually, especially person/place/institution names
  timestamps: inspect segment timing manually for at least three samples
samples:
  - sample_id: trt_haber_1_full
    category: clean_news
    source_path: testklipler/trt_haber (1).mp4
    start_sec: null
    end_sec: null
    reference_path: references/asr_model_final/trt_haber_1_full.txt
    review_priority: high
    notes: Clean TRT news, good default acceptance sample.
  - sample_id: trt_haber_2_full
