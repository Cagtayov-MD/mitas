    expected_outputs:
      - baseline_available
    benchmark_required: true
    selected_as_engine: false
    notes: "Existing reference point, not a production selection."
  - module_area: OCR
    candidate_name: EasyOCR
    priority: 99
    status: ignored
    venv: none
    install_state: ignored_by_decision
    smoke_test_command: "disabled: EasyOCR ignored; PaddleOCR is the active OCR path"
    expected_outputs:
      - ignored
    benchmark_required: false
    selected_as_engine: false
    notes: "Ignored as of 2026-05-21 to avoid Torch/Paddle coupling in OCR; continue with PaddleOCR."
