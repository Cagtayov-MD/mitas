version: 1
name: MITAS Model Manifest
policy:
  no_engine_selection_before_benchmark: true
  all_candidates_selected_as_engine_false: true
candidates:
  - module_area: OCR
    candidate_name: OneOCR
    priority: 1
    status: candidate
    venv: ocr
    install_state: external_or_not_installed_unverified
    smoke_test_command: "TBD: verify local OneOCR runtime/import without download"
    expected_outputs:
      - import_or_runtime_detected
      - version_or_capability_report
    benchmark_required: true
    selected_as_engine: false
    notes: "Active and prioritized OCR test candidate; production OCR still depends on benchmark."
  - module_area: OCR
    candidate_name: PaddleOCR
    priority: 2
    status: candidate
    venv: ocr
    install_state: not_installed_or_unverified
    smoke_test_command: "python -c \"import paddleocr; print('import_ok')\""
    expected_outputs:
      - import_ok
      - version
    benchmark_required: true
    selected_as_engine: false
    notes: "Strong parallel OCR candidate."
  - module_area: OCR
    candidate_name: VITOS baseline
    priority: 3
    status: baseline_candidate
    venv: ocr
    install_state: not_installed_or_unverified
